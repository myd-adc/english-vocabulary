<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f3ef" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#101412" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="LexiVocab" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>LexiVocab</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <script>
    // Apply the saved theme before first paint (no flash). "system" = follow the OS.
    try {
      const t = localStorage.getItem("lexivocab-theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (_) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
